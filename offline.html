<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f2027" />
    <title>Offline | Uni Schedule</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f2027;
        --card: #152c3a;
        --text: #e8f1f8;
        --muted: #a3bfce;
        --accent: #40c4ff;
        --border: #2a4a5d;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }
      body {
        font-family: "Vazirmatn", Tahoma, "Segoe UI", sans-serif;
        background:
          radial-gradient(900px 280px at 50% -10%, #205c7a66, transparent 70%),
          var(--bg);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(92vw, 460px);
        border: 1px solid var(--border);
        border-radius: 20px;
        background: linear-gradient(150deg, #1a3445, var(--card));
        box-shadow: 0 18px 40px #00000066;
        padding: 20px 18px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.18rem;
        font-weight: 900;
      }
      p {
        margin: 0 0 12px;
        line-height: 1.9;
        color: var(--muted);
        font-size: 0.95rem;
      }
      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      button,
      a {
        border: 1px solid var(--border);
        border-radius: 12px;
        min-height: 42px;
        padding: 10px 14px;
        font: inherit;
        font-weight: 800;
        text-decoration: none;
        color: var(--text);
        background: #1d3a4b;
      }
      .primary {
        border-color: #2f8db8;
        background: linear-gradient(130deg, #2f8db8, var(--accent));
        color: #00131d;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>اتصال اینترنت در دسترس نیست</h1>
      <p>
        اپ در حالت آفلاین اجرا شده است. اگر این اولین بار است که برنامه را باز می‌کنید،
        یک‌بار با اینترنت وارد برنامه شوید تا فایل‌ها کامل کش شوند.
      </p>
      <p>
        بعد از اتصال مجدد، روی دکمه «تلاش دوباره» بزنید.
      </p>
      <div class="actions">
        <button class="primary" type="button" onclick="location.reload()">
          تلاش دوباره
        </button>
        <a href="./index.html">باز کردن صفحه اصلی</a>
      </div>
    </main>
  </body>
</html>
